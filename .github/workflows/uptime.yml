name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.repository }}-upptime
  cancel-in-progress: false

jobs:
  check:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.44.0
        with:
          command: "update"
        env:
          GH_PAT: ${{ github.token }}
